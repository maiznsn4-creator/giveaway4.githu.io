<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Store | Giveaway $10 x 2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Moul&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #31344b;
            --main-accent: #0088cc;
            --gold: #f1c40f;
            --shadow-raised: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
            --shadow-pressed: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .container { width: 100%; max-width: 420px; }
        .card { 
            background-color: var(--bg-color); 
            border-radius: 30px; 
            padding: 30px 20px; 
            box-shadow: var(--shadow-raised); 
            text-align: center; 
        }

        .prize-banner {
            background: var(--bg-color);
            box-shadow: var(--shadow-raised);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 2.5px solid white;
        }
        .prize-amount { font-size: 28px; font-weight: 800; color: var(--gold); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }

        h2 { font-family: 'Moul', serif; color: var(--main-accent); font-size: 18px; margin-bottom: 8px; }
        .subtitle { font-size: 11px; opacity: 0.7; margin-bottom: 25px; line-height: 1.5; }

        /* បញ្ជី Channel បែប Grid */
        .channel-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 25px; 
            max-height: 250px; 
            overflow-y: auto; 
            padding: 10px;
            scrollbar-width: none; /* សម្រាប់ Firefox */
        }
        .channel-grid::-webkit-scrollbar { display: none; } /* លាក់ scrollbar សម្រាប់ Chrome/Safari */

        .btn-channel {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 15px; border-radius: 12px; background: var(--bg-color);
            box-shadow: var(--shadow-raised); text-decoration: none; color: var(--text-color);
            font-weight: 700; font-size: 12px; transition: 0.2s;
        }
        .btn-channel i { color: var(--main-accent); font-size: 16px; }
        .btn-channel:active { box-shadow: var(--shadow-pressed); transform: scale(0.95); }

        .btn-verify {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: var(--main-accent); color: white; font-weight: bold;
            font-size: 16px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,136,204,0.3);
            transition: 0.3s;
        }
        .btn-verify:active { transform: translateY(2px); opacity: 0.9; }

        /* Step 2 & Info Box */
        #step2, #already-joined { display: none; }
        .user-box { 
            background: var(--bg-color); box-shadow: var(--shadow-pressed); 
            padding: 20px; border-radius: 20px; margin-bottom: 25px; 
            text-align: left; font-size: 13px; line-height: 1.8;
        }
        .user-box b { color: var(--main-accent); }
        .success-icon { font-size: 60px; color: #2ecc71; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="step1">
        <div class="prize-banner">
            <div style="font-size: 12px; font-weight: bold; opacity: 0.6; margin-bottom: 5px;">SPECIAL GIVEAWAY</div>
            <div class="prize-amount"><i class="fas fa-trophy"></i> $10.00 x 2 នាក់</div>
        </div>
        <h2>SELECT STORE</h2>
        <p class="subtitle">សូមចុច Join គ្រប់ Channel ខាងក្រោមដើម្បីចូលរួមការចាប់ឆ្នោត</p>

        <div class="channel-grid" id="channel-container">
            </div>

        <button class="btn-verify" onclick="checkMembership()">ផ្ទៀងផ្ទាត់ និងចូលរួម</button>
    </div>

    <div class="card" id="step2">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h2>ផ្ទៀងផ្ទាត់ជោគជ័យ!</h2>
        <p class="subtitle">សូមចុចប៊ូតុងខាងក្រោមដើម្បីបញ្ជូនឈ្មោះទៅកាន់ប្រព័ន្ធ</p>
        
        <div class="user-box" id="user-info"></div>

        <button class="btn-verify" style="background: #2ecc71; box-shadow: 0 5px 15px rgba(46,204,113,0.3);" onclick="submitGiveaway()">បញ្ជូនឈ្មោះឥឡូវនេះ</button>
    </div>

    <div class="card" id="already-joined">
        <i class="fas fa-user-shield" style="font-size: 60px; color: var(--main-accent); margin-bottom: 20px;"></i>
        <h2>អ្នកបានចូលរួមរួចហើយ</h2>
        <p class="subtitle">គណនីរបស់អ្នកបានចុះឈ្មោះក្នុងបញ្ជីរួចរាល់ហើយ។ <br>សូមរង់ចាំការប្រកាសលទ្ធផលក្នុង Channel!</p>
        <button class="btn-verify" onclick="tg.close()">ចាកចេញ</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const BOT_TOKEN = "8212122943:AAFOREIno5CXRklS_X9Kiwz6iAput2zExtI";
    const ADMIN_LOG = "-1003546587142";

    // បញ្ជី Channel (បងអាចបន្ថែម ID និង Link ដល់ ១០០ ក៏បាននៅទីនេះ)
    const CHANNELS_DATA = [
        { id: "-1002259615654", link: "https://t.me/Select_Store1" },
        { id: "-1001844015273", link: "https://t.me/Select_Store2" }
        // ចង់ថែមទៀត បងគ្រាន់តែ Copy ជួរខាងលើដាក់ចុះមកក្រោម រួចប្តូរ ID និង Link
    ];

    // បង្ហាញប៊ូតុង Channel ស្វ័យប្រវត្តិ (Channel 1, Channel 2...)
    const container = document.getElementById('channel-container');
    CHANNELS_DATA.forEach((ch, index) => {
        const btn = document.createElement('a');
        btn.href = ch.link;
        btn.target = "_blank";
        btn.className = "btn-channel";
        btn.innerHTML = `<i class="fab fa-telegram"></i> Channel ${index + 1}`;
        container.appendChild(btn);
    });

    // ពិនិត្យ Cloud Storage ការពារការចុះឈ្មោះស្ទួន
    tg.CloudStorage.getItem('select_give_v10', (err, value) => {
        if (value === 'done') {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('already-joined').style.display = 'block';
        }
    });

    async function checkMembership() {
        const user = tg.initDataUnsafe.user;
        if(!user) return Swal.fire('Error', 'សូមបើកក្នុង Telegram!', 'error');

        Swal.fire({ title: 'កំពុងពិនិត្យ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        let isAllJoined = true;
        for (let ch of CHANNELS_DATA) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${ch.id}&user_id=${user.id}`);
                const data = await res.json();
                if (!data.ok || !['member', 'administrator', 'creator'].includes(data.result.status)) {
                    isAllJoined = false;
                    break;
                }
            } catch (e) {
                isAllJoined = false;
                break;
            }
        }

        Swal.close();

        if (isAllJoined) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('user-info').innerHTML = `
                <b>🆔 ID:</b> ${user.id}<br>
                <b>👤 ឈ្មោះ:</b> ${user.first_name} ${user.last_name || ''}<br>
                <b>🔗 Username:</b> @${user.username || 'មិនមាន'}<br>
                <b>✅ ស្ថានភាព:</b> Join All Channels (Verified)
            `;
        } else {
            Swal.fire({
                icon: 'warning',
                title: 'មិនទាន់គ្រប់លក្ខខណ្ឌ',
                text: 'សូមចូលរួម (Join) ឱ្យគ្រប់ Channel ទាំងអស់ជាមុនសិន!',
                confirmButtonColor: '#0088cc'
            });
        }
    }

    async function submitGiveaway() {
        const user = tg.initDataUnsafe.user;
        const entryText = `🎉 GIVEAWAY ENTRY $10 x 2 🎉\n\n🆔 ID: ${user.id}\n👤 ឈ្មោះ: ${user.first_name}\n🔗 Username: @${user.username || 'N/A'}\n✅ ស្ថានភាព: ផ្ទៀងផ្ទាត់រួចរាល់`;

        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_LOG}&text=${encodeURIComponent(entryText)}`);
            
            // កត់ត្រាទុកក្នុង Cloud
            tg.CloudStorage.setItem('select_give_v10', 'done');

            Swal.fire({
                icon: 'success',
                title: 'ជោគជ័យ!',
                text: 'ឈ្មោះរបស់អ្នកត្រូវបានកត់ត្រាទុក',
                timer: 2500,
                showConfirmButton: false
            }).then(() => tg.close());

        } catch (e) {
            Swal.fire('Error', 'មានបញ្ហាបច្ចេកទេស មិនអាចបញ្ជូនបាន!', 'error');
        }
    }
</script>
</body>
  </html>
