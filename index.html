<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Store | Giveaway System</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Moul&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #31344b;
            --main-accent: #0088cc;
            --gold: #f1c40f;
            --shadow-raised: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
            --shadow-pressed: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .container { width: 100%; max-width: 420px; }
        .card { background-color: var(--bg-color); border-radius: 30px; padding: 30px 20px; box-shadow: var(--shadow-raised); text-align: center; }

        .prize-banner {
            background: var(--bg-color); box-shadow: var(--shadow-raised);
            padding: 20px; border-radius: 20px; margin-bottom: 25px; border: 2.5px solid white;
        }
        .prize-amount { font-size: 28px; font-weight: 800; color: var(--gold); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }

        h2 { font-family: 'Moul', serif; color: var(--main-accent); font-size: 18px; margin-bottom: 8px; }
        .subtitle { font-size: 11px; opacity: 0.7; margin-bottom: 25px; }

        .channel-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            margin-bottom: 25px; padding: 10px;
        }

        .btn-channel {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 15px; border-radius: 12px; background: var(--bg-color);
            box-shadow: var(--shadow-raised); text-decoration: none; color: var(--text-color);
            font-weight: 700; font-size: 13px; transition: 0.2s;
        }
        .btn-channel i { color: var(--main-accent); }
        .btn-channel:active { box-shadow: var(--shadow-pressed); transform: scale(0.95); }

        .btn-verify {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: var(--main-accent); color: white; font-weight: bold;
            font-size: 16px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,136,204,0.3);
        }
        .btn-verify:active { transform: translateY(2px); opacity: 0.9; }

        #step2, #already-joined { display: none; }
        .user-box { background: var(--bg-color); box-shadow: var(--shadow-pressed); padding: 20px; border-radius: 20px; margin-bottom: 25px; text-align: left; font-size: 13px; line-height: 1.8; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="step1">
        <div class="prize-banner">
            <div style="font-size: 12px; font-weight: bold; opacity: 0.6; margin-bottom: 5px;">GIVEAWAY</div>
            <div class="prize-amount">$10.00 x 2 នាក់</div>
        </div>
        <h2>SELECT STORE</h2>
        <p class="subtitle">សូមចុច Join ឱ្យគ្រប់ 7 Channel ខាងក្រោម</p>

        <div class="channel-grid">
            <a href="https://t.me/Select_Store1" target="_blank" class="btn-channel"><i class="fab fa-telegram"></i> Channel 1</a>
            <a href="https://t.me/Select_Store2" target="_blank" class="btn-channel"><i class="fab fa-telegram"></i> Channel 2</a>
            <a href="https://t.me/Sopheakbothstore" target="_blank" class="btn-channel"><i class="fab fa-telegram"></i> Channel 3</a>
            <a href="https://t.me/denstore197" target="_blank" class="btn-channel"><i class="fab fa-telegram"></i> Channel 4</a>
            <a href="https://t.me/elcystoree" target="_blank" class="btn-channel"><i class="fab fa-telegram"></i> Channel 5</a>
            <a href="https://t.me/wlwmatcha" target="_blank" class="btn-channel"><i class="fab fa-telegram"></i> Channel 6</a>
            <a href="https://t.me/heng_shop11" target="_blank" class="btn-channel" style="grid-column: span 2;"><i class="fab fa-telegram"></i> Channel 7</a>
        </div>

        <button class="btn-verify" onclick="checkMembership()">ផ្ទៀងផ្ទាត់ការចូលរួម</button>
    </div>

    <div class="card" id="step2">
        <i class="fas fa-check-circle" style="font-size: 60px; color: #2ecc71; margin-bottom: 15px;"></i>
        <h2>ផ្ទៀងផ្ទាត់ជោគជ័យ!</h2>
        <div class="user-box" id="user-info"></div>
        <button class="btn-verify" style="background: #2ecc71;" onclick="submitGiveaway()">ចុះឈ្មោះឥឡូវនេះ</button>
    </div>

    <div class="card" id="already-joined">
        <i class="fas fa-user-shield" style="font-size: 60px; color: var(--main-accent); margin-bottom: 20px;"></i>
        <h2>អ្នកបានចូលរួមរួចហើយ</h2>
        <button class="btn-verify" onclick="tg.close()">ចាកចេញ</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const BOT_TOKEN = "8212122943:AAFOREIno5CXRklS_X9Kiwz6iAput2zExtI";
    const ADMIN_LOG = "-1003546587142";
    
    const CHANNELS = [
        "-1002259615654", "-1001844015273", "-1003900437296", 
        "-1003732869251", "-1003163059635", "-1003895190674", "-1003905865213"
    ];

    tg.CloudStorage.getItem('select_v22', (err, value) => {
        if (value === 'done') {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('already-joined').style.display = 'block';
        }
    });

    async function checkMembership() {
        const user = tg.initDataUnsafe.user;
        if(!user) return Swal.fire('Error', 'សូមបើកក្នុង Telegram!', 'error');

        Swal.fire({ title: 'កំពុងពិនិត្យ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        let joinedCount = 0;
        for (let cid of CHANNELS) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${cid}&user_id=${user.id}`);
                const data = await response.json();
                if (data.ok && ['member', 'administrator', 'creator'].includes(data.result.status)) joinedCount++;
            } catch (e) {}
        }
        Swal.close();

        if (joinedCount >= CHANNELS.length) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('user-info').innerHTML = `
                <b>🆔 ID:</b> ${user.id}<br>
                <b>👤 ឈ្មោះ:</b> ${user.first_name}<br>
                <b>✅ ស្ថានភាព:</b> បាន Join គ្រប់ 7 Channel
            `;
        } else {
            Swal.fire({
                icon: 'warning',
                title: 'មិនទាន់គ្រប់លក្ខខណ្ឌ',
                text: `បងទើបតែ Join បាន ${joinedCount}/7 Channel ប៉ុណ្ណោះ។`,
                confirmButtonColor: '#0088cc'
            });
        }
    }

    async function submitGiveaway() {
        const user = tg.initDataUnsafe.user;
        const entryText = `🎉 GIVEAWAY ENTRY 🎉\n\n🆔 ID: ${user.id}\n👤 ឈ្មោះ: ${user.first_name}\n📜 ស្ថានភាព: Join គ្រប់ 7/7`;

        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_LOG}&text=${encodeURIComponent(entryText)}`);
            const data = await res.json();
            if(data.ok) {
                tg.CloudStorage.setItem('select_v22', 'done');
                Swal.fire('ជោគជ័យ', 'ឈ្មោះរបស់បងត្រូវបានកត់ត្រាទុក!', 'success').then(() => tg.close());
            }
        } catch (e) {}
    }
</script>
</body>
</html>
